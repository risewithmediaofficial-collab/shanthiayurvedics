name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands & Deploy Docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e

            echo "=================================================="
            echo "🚀 Starting Automated Deployment Pipeline on VPS"
            echo "=================================================="

            # 1. Resolve Docker Compose command (Compose V2 plugin or V1)
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "❌ Error: Docker Compose is not installed on this server!"
              exit 1
            fi
            echo "Using Compose binary: $DC"

            # 2. Locate active project directory (if existing compose project is in another path)
            DEPLOY_DIR="/docker/shanthiayurvedics"
            ACTIVE_CONTAINER=$(docker ps -q --filter "publish=8087" | head -n 1)
            if [ -z "$ACTIVE_CONTAINER" ]; then
              ACTIVE_CONTAINER=$(docker ps -q --filter "publish=89" | head -n 1)
            fi

            if [ -n "$ACTIVE_CONTAINER" ]; then
              LABEL_DIR=$(docker inspect "$ACTIVE_CONTAINER" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)
              if [ -n "$LABEL_DIR" ] && [ -d "$LABEL_DIR/.git" ]; then
                echo "⚡ Discovered existing active compose directory: $LABEL_DIR"
                DEPLOY_DIR="$LABEL_DIR"
              fi
            fi

            echo "Deployment target directory: $DEPLOY_DIR"

            # 3. Ensure repo exists and is valid git repository
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "⚡ Initializing repository in $DEPLOY_DIR..."
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/risewithmediaofficial-collab/shanthiayurvedics.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # 4. Pull and force-sync with latest origin/main
            echo "📥 Fetching and syncing to latest origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 5. Ensure .env file exists and configure ports & database
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
            fi

            # Ensure CRM_PORT is explicitly set to 8087 so production binds 8087
            if grep -q "^CRM_PORT=" .env; then
              sed -i 's/^CRM_PORT=.*/CRM_PORT=8087/' .env
            else
              echo "CRM_PORT=8087" >> .env
            fi

            # Ensure MONGO_URI in .env targets mongodb container host and volume credentials
            sed -i 's|127.0.0.1:27017|mongodb:27017|g' .env 2>/dev/null || true
            sed -i 's|localhost:27017|mongodb:27017|g' .env 2>/dev/null || true
            sed -i 's|replace_with_a_long_url_safe_random_password|SecureAdminPassword123|g' .env 2>/dev/null || true

            # Ensure MSG91 WhatsApp configuration in .env
            if grep -q "^MSG91_AUTHKEY=" .env; then
              sed -i 's/^MSG91_AUTHKEY=.*/MSG91_AUTHKEY=522920AfQjLRoczqn6ad86913P1/' .env
            else
              echo "MSG91_AUTHKEY=522920AfQjLRoczqn6ad86913P1" >> .env
            fi

            if ! grep -q "^MSG91_WHATSAPP_INTEGRATED_NUMBER=" .env; then
              echo "MSG91_WHATSAPP_INTEGRATED_NUMBER=918884747209" >> .env
            fi

            if ! grep -q "^MSG91_WHATSAPP_NAMESPACE=" .env; then
              echo "MSG91_WHATSAPP_NAMESPACE=0366c008_69c0_4b6a_aa0b_740b15b04344" >> .env
            fi

            # Ensure TPC live integration configuration in .env
            if grep -q "^TPC_MODE=" .env; then
              sed -i 's/^TPC_MODE=.*/TPC_MODE=live/' .env
            else
              echo "TPC_MODE=live" >> .env
            fi

            if grep -q "^TPC_CLIENT_ID=" .env; then
              sed -i 's/^TPC_CLIENT_ID=.*/TPC_CLIENT_ID=HRDNHBS0025/' .env
            else
              echo "TPC_CLIENT_ID=HRDNHBS0025" >> .env
            fi

            if grep -q "^TPC_PASSWORD=" .env; then
              sed -i 's/^TPC_PASSWORD=.*/TPC_PASSWORD=NHB2023/' .env
            else
              echo "TPC_PASSWORD=NHB2023" >> .env
            fi

            if grep -q "^TPC_SENDER_CODE=" .env; then
              sed -i 's/^TPC_SENDER_CODE=.*/TPC_SENDER_CODE=HRDNHBS0025/' .env
            else
              echo "TPC_SENDER_CODE=HRDNHBS0025" >> .env
            fi

            if ! grep -q "^TPC_BASE_URL=" .env; then
              echo "TPC_BASE_URL=https://www.tpcglobe.com" >> .env
            fi

            if ! grep -q "^TPC_COD_ENABLED=" .env; then
              echo "TPC_COD_ENABLED=false" >> .env
            fi

            # Error trap: If any failure happens during build or deployment, ensure Maintenance Mode stays up so users never get a raw 502 Bad Gateway
            trap '
              echo "⚠️ Deployment encountered an issue! Ensuring Maintenance Mode is active so users do not see 502..."
              if ! docker ps --filter "name=shanthi_maintenance" --filter "status=running" | grep -q shanthi_maintenance; then
                for port in 8087 89; do
                  pids=$(docker ps -q --filter "publish=$port")
                  if [ -n "$pids" ]; then
                    docker stop $pids 2>/dev/null || true
                    docker rm -f $pids 2>/dev/null || true
                  fi
                done
                docker run -d --name shanthi_maintenance --restart always \
                  -p 8087:80 -p 89:80 \
                  -v "$DEPLOY_DIR/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
                  -v "$DEPLOY_DIR/maintenance/maintenance.html:/usr/share/nginx/html/maintenance.html:ro" \
                  nginx:alpine 2>/dev/null || true
              fi
            ' ERR

            # 6. Activate Maintenance Mode immediately on ports 8087 & 89
            echo "🚧 Step 6: Activating Maintenance Mode on ports 8087 & 89..."
            # Pre-pull nginx:alpine if not present so startup is sub-second
            docker pull nginx:alpine >/dev/null 2>&1 || true

            # Free ports 8087 and 89 from the old frontend
            docker stop shanthi_frontend 2>/dev/null || true
            docker rm -f shanthi_frontend 2>/dev/null || true
            for port in 8087 89; do
              pids=$(docker ps -q --filter "publish=$port")
              if [ -n "$pids" ]; then
                echo "Clearing container holding port $port: $pids"
                docker stop $pids 2>/dev/null || true
                docker rm -f $pids 2>/dev/null || true
              fi
            done

            # Launch lightweight maintenance container immediately
            docker rm -f shanthi_maintenance 2>/dev/null || true
            docker run -d --name shanthi_maintenance --restart always \
              -p 8087:80 -p 89:80 \
              -v "$DEPLOY_DIR/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$DEPLOY_DIR/maintenance/maintenance.html:/usr/share/nginx/html/maintenance.html:ro" \
              nginx:alpine

            echo "✅ Maintenance Mode is LIVE on ports 8087 and 89. Visitors will see the Under Maintenance screen."

            # 7. Force rebuild without cache while maintenance mode is safely serving visitors
            echo "🔨 Step 7: Building fresh Docker images with --no-cache..."
            $DC build --no-cache

            # 8. Start up database and backend services
            echo "🚀 Step 8: Starting backend and database containers..."
            $DC up -d mongodb backend

            # 9. Verify backend health before cutting over
            echo "⏳ Step 9: Waiting for backend service to become healthy..."
            BACKEND_HEALTHY=false
            for i in $(seq 1 40); do
              STATUS=$(docker inspect --format='{{json .State.Health.Status}}' shanthi_backend 2>/dev/null || echo '"starting"')
              if [ "$STATUS" = '"healthy"' ]; then
                echo "✅ Backend service is healthy and ready to serve!"
                BACKEND_HEALTHY=true
                break
              fi
              echo "Waiting for backend health ($i/40, status: $STATUS)..."
              sleep 2
            done

            # 10. Switch from Maintenance Mode to Production Frontend
            echo "✨ Step 10: Seamless switchover: Removing maintenance container and starting production frontend..."
            docker stop shanthi_maintenance 2>/dev/null || true
            docker rm -f shanthi_maintenance 2>/dev/null || true

            for port in 8087 89; do
              pids=$(docker ps -q --filter "publish=$port")
              if [ -n "$pids" ]; then
                docker stop $pids 2>/dev/null || true
                docker rm -f $pids 2>/dev/null || true
              fi
            done

            if ! $DC up -d --force-recreate frontend; then
              echo "⚠️ Frontend startup issue encountered. Restoring maintenance container for safety:"
              docker run -d --name shanthi_maintenance --restart always \
                -p 8087:80 -p 89:80 \
                -v "$DEPLOY_DIR/maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
                -v "$DEPLOY_DIR/maintenance/maintenance.html:/usr/share/nginx/html/maintenance.html:ro" \
                nginx:alpine 2>/dev/null || true
              $DC logs --tail 50 backend 2>/dev/null || true
              $DC logs --tail 50 frontend 2>/dev/null || true
              exit 1
            fi

            # 11. Clean up dangling images to keep VPS disk healthy
            echo "🧹 Step 11: Pruning unused images..."
            docker image prune -f

            # 12. Verify that services are up and healthy
            echo "📋 Step 12: Final container status verification:"
            sleep 3
            $DC ps

            echo "=================================================="
            echo "✅ Deployment Successful! Shanthi CRM is Online!"
            echo "=================================================="
