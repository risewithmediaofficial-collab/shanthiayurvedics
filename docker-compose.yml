services:
  mongodb:
    image: mongo:7.0
    container_name: shanthi_mongodb
    restart: unless-stopped
    ports:
      - "27025:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SecureAdminPassword123
      MONGO_INITDB_DATABASE: shanthi_ayurvedas_crm
    volumes:
      - mongodb_data:/data/db
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u admin -p SecureAdminPassword123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || mongosh --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: shanthiayurvedics-backend:latest
    container_name: shanthi_backend
    restart: unless-stopped
    ports:
      - "5009:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGO_URI: mongodb://admin:SecureAdminPassword123@mongodb:27017/shanthi_ayurvedas_crm?authSource=admin
      MONGODB_URI: mongodb://admin:SecureAdminPassword123@mongodb:27017/shanthi_ayurvedas_crm?authSource=admin
      JWT_ACCESS_SECRET: default_production_super_secret_jwt_access_key_2026_shanthi_ayurvedas
      JWT_REFRESH_SECRET: default_production_super_secret_jwt_refresh_key_2026_shanthi_ayurvedas
      COOKIE_SECRET: default_production_super_secret_cookie_key_2026_shanthi_ayurvedas
      FRONTEND_URL: http://localhost:88
    networks:
      - crm-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: shanthiayurvedics-frontend:latest
    container_name: shanthi_frontend
    restart: unless-stopped
    ports:
      - "88:80"
      - "8085:80"
    depends_on:
      - backend
    networks:
      - crm-network

volumes:
  mongodb_data:

networks:
  crm-network:
    driver: bridge
