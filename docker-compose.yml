services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-SecureAdminPassword123}
      MONGO_INITDB_DATABASE: shanthi_ayurvedas_crm
    volumes:
      - mongodb_data:/data/db
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' >/dev/null || mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-SecureAdminPassword123}@mongodb:27017/shanthi_ayurvedas_crm?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-production_secure_jwt_access_key_crm_94829471948201948201}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_secure_jwt_refresh_key_crm_58392819485720194820}
      COOKIE_SECRET: ${COOKIE_SECRET:-production_secure_cookie_secret_crm_71829401827401928401}
      FRONTEND_URL: ${FRONTEND_URL:-http://82.29.166.169:8087}
      TRUST_PROXY_HOPS: "1"
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-20}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY:-522920AfQjLRoczqn6ad86913P1}
      MSG91_WHATSAPP_INTEGRATED_NUMBER: ${MSG91_WHATSAPP_INTEGRATED_NUMBER:-918884747209}
      MSG91_WHATSAPP_NAMESPACE: ${MSG91_WHATSAPP_NAMESPACE:-0366c008_69c0_4b6a_aa0b_740b15b04344}
      MSG91_WHATSAPP_TEMPLATE_NAME: ${MSG91_WHATSAPP_TEMPLATE_NAME:-shanthi_order_confirmed}
      MSG91_WHATSAPP_DISPATCH_TEMPLATE_NAME: ${MSG91_WHATSAPP_DISPATCH_TEMPLATE_NAME:-shanthi_order_dispatched}
      TPC_MODE: ${TPC_MODE:-live}
      TPC_BASE_URL: ${TPC_BASE_URL:-https://www.tpcglobe.com}
      TPC_CLIENT_ID: ${TPC_CLIENT_ID:-HRDNHBS0025}
      TPC_PASSWORD: ${TPC_PASSWORD:-NHB2023}
      TPC_SENDER_CODE: ${TPC_SENDER_CODE:-HRDNHBS0025}
      TPC_SENDER_NAME: ${TPC_SENDER_NAME:-Shanthi Ayurvedas}
      TPC_SENDER_ADDRESS: ${TPC_SENDER_ADDRESS:-No 45 Ayur Bhavan, Main Road}
      TPC_SENDER_CITY: ${TPC_SENDER_CITY:-Hosur}
      TPC_SENDER_PINCODE: ${TPC_SENDER_PINCODE:-635109}
      TPC_SENDER_MOB: ${TPC_SENDER_MOB:-9876543210}
      TPC_SENDER_EMAIL: ${TPC_SENDER_EMAIL:-orders@shanthiayurvedas.com}
      TPC_SENDER_GSTIN: ${TPC_SENDER_GSTIN:-33AAAAA0000A1Z5}
      TPC_COD_ENABLED: ${TPC_COD_ENABLED:-false}
      TPC_TRACKING_SYNC_ENABLED: ${TPC_TRACKING_SYNC_ENABLED:-true}
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>r.ok?process.exit(0):fetch('http://127.0.0.1:5000/health').then(r2=>process.exit(r2.ok?0:1))).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-8087}:80"
      - "89:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-network

volumes:
  mongodb_data:

networks:
  crm-network:
    driver: bridge
