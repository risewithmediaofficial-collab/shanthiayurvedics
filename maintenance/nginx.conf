server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Prevent caching of maintenance mode in browsers and intermediaries
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Retry-After "15" always;

    # Healthcheck endpoints probed by auto-reload script
    location = /health {
        default_type application/json;
        return 503 '{"status":"deploying","message":"System upgrade in progress","service":"shanthi-ayurvedas-maintenance"}';
    }

    location = /api/health {
        default_type application/json;
        return 503 '{"status":"deploying","message":"System upgrade in progress","service":"shanthi-ayurvedas-maintenance"}';
    }

    # Custom 503 error handling
    error_page 503 @maintenance_view;

    location @maintenance_view {
        rewrite ^(.*)$ /maintenance.html break;
    }

    location = /maintenance.html {
        # Allow internal rendering of the maintenance page
    }

    # Catch-all: send 503 status code with maintenance page
    location / {
        return 503;
    }
}
